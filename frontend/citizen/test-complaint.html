<!DOCTYPE html>
<html>
<head><title>Test Fraud Complaint</title>
<style>
body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
.section { margin: 20px 0; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
button { padding: 10px 20px; margin: 5px; cursor: pointer; background: #0066cc; color: white; border: none; border-radius: 4px; }
button:disabled { background: #ccc; }
.status { padding: 10px; margin: 10px 0; border-radius: 4px; }
.success { background: #d4edda; color: #155724; }
.error { background: #f8d7da; color: #721c24; }
.info { background: #d1ecf1; color: #0c5460; }
</style>
</head>
<body>
<h1> Fraud Complaint Test</h1>
<div class="section">
<h2>Step 1: Start DigiLocker</h2>
<button id="btn-start">Start</button>
<div id="s1"></div>
</div>
<div class="section">
<h2>Step 2: Complete (OTP: 123456)</h2>
<input id="otp" value="123456" maxlength="6" disabled>
<button id="btn-complete" disabled>Complete</button>
<div id="s2"></div>
</div>
<div class="section">
<h2>Step 3: Submit Complaint</h2>
<button id="btn-submit" disabled>Submit</button>
<div id="s3"></div>
</div>
<div class="section">
<h2>Step 4: Track</h2>
<input id="track-id" size="30" disabled>
<button id="btn-track" disabled>Track</button>
<div id="s4"></div>
</div>
<script>
const API = window.location.origin;
let token, refId;
const log = (id, msg, type='info') => document.getElementById(id).innerHTML = `<div class="status ${type}">${msg}</div>`;

document.getElementById('btn-start').onclick = async () => {
    try {
        const r = await fetch(`${API}/api/digilocker/start`, {method:'POST', headers:{'Content-Type':'application/json'}});
        if(r.ok) {
            const d = await r.json(); token = d.verify_token;
            log('s1', `<b>Token:</b> ${token}`, 'success');
            document.getElementById('otp').disabled = false; document.getElementById('btn-complete').disabled = false;
        } else log('s1', `Error: ${await r.text()}`, 'error');
    } catch(e) { log('s1', `Error: ${e}`, 'error'); }
};

document.getElementById('btn-complete').onclick = async () => {
    try {
        const r = await fetch(`${API}/api/digilocker/simulate-complete`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({verify_token: token, otp: document.getElementById('otp').value})
        });
        if(r.ok) {
            log('s2', '<b>Verified!</b>', 'success'); document.getElementById('btn-submit').disabled = false;
        } else log('s2', `Error: ${await r.text()}`, 'error');
    } catch(e) { log('s2', `Error: ${e}`, 'error'); }
};

document.getElementById('btn-submit').onclick = async () => {
    const data = {
        filer_is_complainant: true, filer_name: 'Test', filer_phone: '9876543210', filer_email: 't@test.com',
        complainant_name: 'Test', address: '123 St', city: 'Mumbai', country: 'India', state: 'Maharashtra', zip_code: '400001',
        complainant_phone: '9876543210', complainant_email: 't@test.com',
        incident_description: 'Test complaint.',
        transactions: [], subjects: [], digilocker_verify_token: token
    };
    try {
        const r = await fetch(`${API}/api/fraud-complaints`, {
            method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
        });
        if(r.ok) {
            const d = await r.json(); refId = d.reference_id;
            log('s3', `<b>Submitted!</b><br>Ref ID: <code>${d.reference_id}</code>`, 'success');
            document.getElementById('track-id').value = refId; document.getElementById('track-id').disabled = false;
            document.getElementById('btn-track').disabled = false;
        } else log('s3', `Error ${r.status}: ${await r.text()}`, 'error');
    } catch(e) { log('s3', `Error: ${e}`, 'error'); }
};

document.getElementById('btn-track').onclick = async () => {
    try {
        const r = await fetch(`${API}/api/fraud-complaints/${document.getElementById('track-id').value}`);
        if(r.ok) log('s4', `<b>Found:</b> ${JSON.stringify(await r.json())}`, 'success');
        else log('s4', `Error: ${await r.text()}`, 'error');
    } catch(e) { log('s4', `Error: ${e}`, 'error'); }
};
</script>
</body>
</html>
